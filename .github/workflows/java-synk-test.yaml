name: Snyk Vulnerability Check

on:
  workflow_call:
    inputs:
      package:
        required: false
        type: string
        default: './...'
      report-cc:
        required: false
        type: string

jobs:
  snyk-vulncheck:
    runs-on: ubuntu-latest

    steps:
      # - name: Checkout code
      #   uses: actions/checkout@v3

      # - name: Set up JDK
      #   uses: actions/setup-java@v3
      #   with:
      #     distribution: 'adopt'
      #     java-version: '11'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk to check for vulnerabilities
        id: snyk
        run: snyk test --json > results.json

      - name: Send email if vulnerabilities found
        if: steps.snyk.outputs.vulnerabilities != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER_ADDRESS }}
          server_port: ${{ secrets.SMTP_SERVER_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '[Java] Vulnerability Report for ${{ github.repository }}'
          body: |
            Hi ${{ github.event.head_commit.author.name }},
            
            The following vulnerabilities were found in your recent commit [https://github.com/${{ github.repository }}/commit/${{ github.sha }}]:
            
            ${{ steps.snyk.outputs.vulnerabilities }}
            
            Please address these issues as soon as possible.
          to: ${{ github.event.head_commit.author.email }}
          from: ${{ secrets.SMTP_SENDER_EMAIL }}
          cc: ${{ inputs.report-cc }}
