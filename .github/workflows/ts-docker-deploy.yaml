name: Deploy to docker host
  
on: 
  workflow_dispatch:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ${{ github.sha }}
      deploy-host-ip:
        required: false
        type: string
        default: '100.102.135.11'
      deploy-host-port:
        required: false
        type: number
        default: 22
      deploy-user:
        required: false
        type: string
        default: github
      deploy-dir:
        required: true
        type: string
    secrets:
      ssh-private-key:
        required: true
      tailscale-auth-key:
        required: true
jobs:
  tailscale-docker-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
    env:
      DEPLOY_HOST: "${{ inputs.service }}.hexam.dev"
    steps:
      - name: Init Connection to Hexam Infrastructure
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.tailscale-auth-key }}
      - name: Configure Host SSH
        uses: shimataro/ssh-key-action@v2
        with:
          name: hexam_github
          known_hosts: placeholder
          config: |
            Host ${{ env.DEPLOY_HOST }}
              Port ${{ inputs.deploy-host-port }}
              HostName ${{ inputs.deploy-host-ip }}
              User ${{ inputs.deploy-user }}
              IdentityFile ~/.ssh/hexam_github
          key: ${{ secrets.ssh-private-key }}
      - name: Overwrite known hosts of ${{ env.DEPLOY_HOST }}
        run: ssh-keyscan -p ${{inputs.deploy-host-port}} ${{ inputs.deploy-host-ip }} > ~/.ssh/known_hosts
      - name: Deploy ${{ inputs.service }} with docker
        run: ssh ${{ env.DEPLOY_HOST }} "make -C ${{ inputs.deploy-dir }} deploy-service-tag service=${{ inputs.service }} tag=${{ inputs.tag }}"